name: Build GHCR Docker image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-subpath-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/23fo/outline

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Resolve image tag
        id: image
        run: |
          ref="${GITHUB_REF_NAME}"

          if [[ ! "${ref}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Invalid source ref: ${ref}" >&2
            echo "Expected vX.Y.Z*" >&2
            exit 1
          fi

          echo "tag=${ref}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: build
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          GIT_SHA: ${{ github.sha }}
        run: |
          docker buildx bake \
            --file docker-bake.subpath.hcl \
            --provenance=false \
            --metadata-file /tmp/build-metadata.json \
            image

          digest="$(jq -r '.image."containerimage.digest" // empty' /tmp/build-metadata.json)"
          if [[ -z "${digest}" ]]; then
            echo "Build completed without an image digest" >&2
            exit 1
          fi

          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Publish build summary
        run: |
          {
            echo "## Docker image published"
            echo
            echo "- Source ref: \`${GITHUB_REF_NAME}\`"
            echo "- Image: \`${IMAGE_NAME}:${{ steps.image.outputs.tag }}\`"
            echo "- Platforms: \`linux/amd64\`, \`linux/arm64\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
