name: Build GHCR Docker image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-ghcr-publish
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Resolve image tag
        id: image
        run: |
          ref="${GITHUB_REF_NAME}"

          if [[ ! "${ref}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Invalid source ref: ${ref}" >&2
            echo "Expected vX.Y.Z*" >&2
            exit 1
          fi

          echo "tag=${ref}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: build
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          GIT_SHA: ${{ github.sha }}
        run: |
          docker buildx bake \
            --file docker-bake.subpath.hcl \
            --provenance=false \
            --metadata-file /tmp/build-metadata.json \
            image

          digest="$(jq -r '.image."containerimage.digest" // empty' /tmp/build-metadata.json)"
          if [[ -z "${digest}" ]]; then
            echo "Build completed without an image digest" >&2
            exit 1
          fi

          image="$(docker buildx bake --file docker-bake.subpath.hcl --print image | jq -er '
            .target.image.tags
            | if length == 1 then .[0] else error("Expected exactly one image tag") end
          ')"
          if [[ -z "${image}" ]]; then
            echo "Build completed without an image tag" >&2
            exit 1
          fi

          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Update latest stable tag
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.build.outputs.image }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          image_name="${IMAGE%:*}"
          published_tag="${IMAGE##*:}"
          package_path="${image_name#ghcr.io/}"
          package_owner="${package_path%%/*}"
          package_name="${package_path#*/}"

          if [[ "${package_path}" == "${image_name}" || "${package_name}" == "${package_path}" ]]; then
            echo "Invalid GHCR image reference: ${IMAGE}" >&2
            exit 1
          fi

          if [[ "${package_owner,,}" != "${REPOSITORY_OWNER,,}" ]]; then
            echo "Image owner ${package_owner} does not match repository owner ${REPOSITORY_OWNER}" >&2
            exit 1
          fi

          encoded_package_name="$(jq -rn --arg value "${package_name}" '$value | @uri')"
          case "${OWNER_TYPE}" in
            Organization)
              endpoint="/orgs/${package_owner}/packages/container/${encoded_package_name}/versions?per_page=100"
              ;;
            User)
              endpoint="/users/${package_owner}/packages/container/${encoded_package_name}/versions?per_page=100"
              ;;
            *)
              echo "Unsupported package owner type: ${OWNER_TYPE}" >&2
              exit 1
              ;;
          esac

          versions_file="$(mktemp)"
          trap 'rm -f "${versions_file}"' EXIT
          package_visible=false

          for attempt in 1 2 3 4 5 6; do
            if gh api --paginate --slurp "${endpoint}" > "${versions_file}" && \
              jq -e --arg tag "${published_tag}" '
                any(.[][]?; any(.metadata.container.tags[]?; . == $tag))
              ' "${versions_file}" > /dev/null; then
              package_visible=true
              break
            fi

            if [[ "${attempt}" -lt 6 ]]; then
              sleep 5
            fi
          done

          if [[ "${package_visible}" != "true" ]]; then
            echo "Published tag did not appear in GitHub Packages: ${published_tag}" >&2
            exit 1
          fi

          stable_tag="$(jq -r '
            [
              .[][]?
              | .metadata.container.tags[]?
              | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+(-subpath-support)?$"))
              | . as $tag
              | capture("^v(?<major>[0-9]+)\\.(?<minor>[0-9]+)\\.(?<patch>[0-9]+)(?<suffix>-subpath-support)?$")
              | {
                  tag: $tag,
                  major: (.major | tonumber),
                  minor: (.minor | tonumber),
                  patch: (.patch | tonumber),
                  suffix: (if .suffix == "-subpath-support" then 1 else 0 end)
                }
            ]
            | unique_by(.tag)
            | sort_by([.major, .minor, .patch, .suffix])
            | last
            | .tag // empty
          ' "${versions_file}")"

          if [[ -z "${stable_tag}" ]]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_image="${image_name}:latest"
          stable_image="${image_name}:${stable_tag}"
          docker buildx imagetools create \
            --tag "${latest_image}" \
            "${stable_image}"

          echo "reference=${latest_image}" >> "$GITHUB_OUTPUT"
          echo "source=${stable_image}" >> "$GITHUB_OUTPUT"
          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Publish build summary
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          LATEST_REFERENCE: ${{ steps.latest.outputs.reference }}
          LATEST_SOURCE: ${{ steps.latest.outputs.source }}
          LATEST_UPDATED: ${{ steps.latest.outputs.updated }}
        run: |
          {
            echo "## Docker image published"
            echo
            echo "- Source ref: \`${GITHUB_REF_NAME}\`"
            echo "- Image: \`${IMAGE}\`"
            echo "- Platforms: \`linux/amd64\`, \`linux/arm64\`"
            echo "- Digest: \`${DIGEST}\`"

            if [[ "${LATEST_UPDATED}" == "true" ]]; then
              echo "- Latest: \`${LATEST_REFERENCE}\` -> \`${LATEST_SOURCE}\`"
            else
              echo "- Latest: unchanged (no stable image tag found)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
