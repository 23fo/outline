name: Build subpath Docker image

on:
  push:
    branches:
      - agent/outline-v1.9.2-subpath
    tags:
      - "v*-subpath*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-subpath-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/23fo/outline
  BASE_IMAGE_NAME: ghcr.io/23fo/outline-base

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate base image metadata
        id: base_meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.BASE_IMAGE_NAME }}
          tags: |
            type=raw,value=1.9.2-subpath
            type=raw,value=subpath-latest
            type=sha,prefix=subpath-
            type=ref,event=tag

      - name: Build and publish base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.base_meta.outputs.tags }}
          labels: ${{ steps.base_meta.outputs.labels }}
          cache-from: type=gha,scope=outline-subpath-base
          cache-to: type=gha,mode=max,scope=outline-subpath-base

      - name: Generate application image metadata
        id: app_meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=1.9.2-subpath
            type=raw,value=subpath-latest
            type=sha,prefix=subpath-
            type=ref,event=tag

      - name: Build and publish application image
        id: app_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE_NAME }}:1.9.2-subpath
          tags: ${{ steps.app_meta.outputs.tags }}
          labels: ${{ steps.app_meta.outputs.labels }}
          cache-from: type=gha,scope=outline-subpath-app
          cache-to: type=gha,mode=max,scope=outline-subpath-app

      - name: Publish build summary
        run: |
          {
            echo "## Docker image published"
            echo
            echo "- Image: \`${IMAGE_NAME}:1.9.2-subpath\`"
            echo "- Rolling tag: \`${IMAGE_NAME}:subpath-latest\`"
            echo "- Platforms: \`linux/amd64\`, \`linux/arm64\`"
            echo "- Digest: \`${{ steps.app_build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
