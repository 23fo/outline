name: Build subpath Docker image

on:
  push:
    branches:
      - "v1.9.2-with-subpath"
    tags:
      - "v*.*.*-with-subpath-v*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag, for example v1.9.2-with-subpath-v1"
        required: true
        default: "v1.9.2-with-subpath-v1"
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-subpath-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/23fo/outline

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Resolve and validate image tag
        id: image
        env:
          DISPATCH_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${DISPATCH_TAG}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            version="${GITHUB_REF_NAME#v}"
            version="${version%-with-subpath}"
            tag="v${version}-with-subpath-v${GITHUB_RUN_NUMBER}"
          fi

          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-with-subpath-v[0-9]+$ ]]; then
            echo "Invalid image tag: ${tag}" >&2
            echo "Expected vX.Y.Z-with-subpath-vN" >&2
            exit 1
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.version=${{ steps.image.outputs.tag }}
            org.opencontainers.image.source=https://github.com/23fo/outline

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.subpath
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=outline-subpath
          cache-to: type=gha,mode=max,scope=outline-subpath

      - name: Publish build summary
        run: |
          {
            echo "## Docker image published"
            echo
            echo "- Image: \`${IMAGE_NAME}:${{ steps.image.outputs.tag }}\`"
            echo "- Platforms: \`linux/amd64\`, \`linux/arm64\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
